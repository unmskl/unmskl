<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="900" height="410" role="img" aria-label="unmskl — Monospace CV">
  <title>unmskl — Monospace CV</title>
  <desc>Developer profile in a larger terminal-inspired layout.</desc>
  <defs>
    <linearGradient id="mc-typing" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="900" height="410" fill="#0d1117"/>

  <text x="54" y="58" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="29" font-weight="600" fill="#e6edf3">unmskl</text>
  <line x1="54" y1="76" x2="846" y2="76" stroke="#21262d" stroke-width="1"/>
  <text x="54" y="106" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#8b949e">Computer science student. Exploring software development and cybersecurity.</text>

  <rect x="54" y="130" width="792" height="214" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="828" y="151" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#484f58" letter-spacing="2">bash</text>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16">
    <text x="76" y="171"><tspan fill="#a78bfa">$</tspan><tspan fill="#c9d1d9"> whoami</tspan></text>
    <text x="76" y="194" fill="#9aa4b0">unmskl — computer.science.student</text>

    <text x="76" y="228"><tspan fill="#a78bfa">$</tspan><tspan fill="#c9d1d9"> cat skills.txt</tspan></text>
    <text x="76" y="251" fill="#9aa4b0">java · sql · jdbc · mariadb · linux · git</text>

    <text x="76" y="285"><tspan fill="#a78bfa">$</tspan><tspan fill="#c9d1d9"> uptime</tspan></text>
    <text x="76" y="308" fill="#9aa4b0">learning, experimenting and building new skills.</text>

    <text x="76" y="332"><tspan fill="#a78bfa">$</tspan><tspan fill="#c9d1d9"> contact --all</tspan></text>
    <text x="76" y="365"><tspan fill="#58a6ff">→ github.com/unmskl</tspan></text>
  </g>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16">
    <text x="54" y="397" fill="url(#mc-typing)">exploring cybersecurity</text>
    <rect x="299" y="384" width="9" height="17" fill="#a78bfa">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
