<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="unmskl — Monospace CV">
  <title>unmskl — Monospace CV</title>
  <desc>A minimal developer profile rendered as a README heading, a terminal-style code block, and an optional animated status line.</desc>
  <defs>
    <linearGradient id="mc-typing" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="430" fill="#0d1117"/>

  <text x="72" y="66" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="27" font-weight="600" fill="#e6edf3">unmskl</text>
  <line x1="72" y1="82" x2="1128" y2="82" stroke="#21262d" stroke-width="1"/>
  <text x="72" y="108" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#8b949e">Computer science student. Exploring software development and cybersecurity.</text>

  <rect x="72" y="132" width="1056" height="224" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="1112" y="152" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#484f58" letter-spacing="2">bash</text>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5">
    <text x="96" y="170"><tspan fill="#a78bfa">$</tspan><tspan fill="#c9d1d9"> whoami</tspan></text>
    <text x="96" y="190" fill="#9aa4b0">unmskl — computer.science.student</text>

    <text x="96" y="220"><tspan fill="#a78bfa">$</tspan><tspan fill="#c9d1d9"> cat skills.txt</tspan></text>
    <text x="96" y="240" fill="#9aa4b0">java · sql · jdbc · mariadb · linux · git</text>

    <text x="96" y="270"><tspan fill="#a78bfa">$</tspan><tspan fill="#c9d1d9"> uptime</tspan></text>
    <text x="96" y="290" fill="#9aa4b0">learning, experimenting and building new skills.</text>

    <text x="96" y="320"><tspan fill="#a78bfa">$</tspan><tspan fill="#c9d1d9"> contact --all</tspan></text>
    <text x="96" y="340"><tspan fill="#58a6ff">→ github.com/unmskl</tspan></text>
  </g>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14">
    <text x="72" y="397" fill="url(#mc-typing)">exploring cybersecurity</text>
    <rect x="286" y="385" width="8" height="15" fill="#a78bfa">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="1128" y="397" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#484f58" letter-spacing="2.5">UNMSKL · PROFILE</text>
</svg>
